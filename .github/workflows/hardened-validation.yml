name: Hardened validation

on:
  push:
    branches: ['security/hardening']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 85225381d89915595598ed13766cd79890c03a84
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Upstream test baseline
        run: go test ./...

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: |
          for attempt in 1 2 3; do
            if go mod download; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          go mod verify
      - name: Build
        run: go build ./cmd/server
      - name: Test
        run: go test ./...

  security-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Security and provider regression tests
        run: |
          go test ./internal/misc ./internal/logging ./internal/config ./internal/api/handlers/management ./internal/api/middleware ./internal/auth/... ./sdk/auth/...
          go test ./internal/translator/codex/... ./internal/translator/claude/... ./internal/translator/antigravity/...
      - name: Repeated timing regression tests
        run: |
          go test ./internal/api -run '^TestServerWebsocketTunnel_EndToEndAndTenantIsolation$' -count=20
          go test ./sdk/cliproxy -run '^TestServiceHeartbeatFailoverDoesNotDrainBlockingScope$' -count=10
          go test ./internal/wstunnel -run '^TestHubExchange_ManyToManyFullDuplexMultiplexing$' -count=20
          go test ./sdk/api/handlers/openai -run '^TestResponsesWebsocketSameSessionLaterCreate429DoesNotReplayAfterDownstreamCommit$' -count=30

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build hardened image
        run: docker build -t cpa-validation .
      - name: Verify runtime identity and bundled frontend
        run: |
          docker run --rm --entrypoint sh cpa-validation -ec '
            test "$(id -u)" = 10001
            test -r "$MANAGEMENT_STATIC_PATH"
            echo "30df9503402af03e04affb55920458c13139a07757c8428fc845299876d19c43  $MANAGEMENT_STATIC_PATH" | sha256sum -c -
          '
